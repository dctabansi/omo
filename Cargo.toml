[package]
name = "omo"
version = "0.3.0"
edition = "2024"
description = "A lightweight, one-mode-only terminal text editor."
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dctabansi/omo"
keywords = ["editor", "text-editor", "terminal", "tui", "cli"]
categories = ["text-editors", "command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.0"
